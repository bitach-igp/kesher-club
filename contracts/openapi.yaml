      required: [changePending]
      properties:
        account:
          type: object
          required: [ibanMasked, holderName]
          properties:
            ibanMasked: { type: string, example: "IL62 •••• •••• 9999" }
            holderName: { type: string }
        changePending: { type: boolean }
    InstitutionPayoutRequest:
      type: object
      description: >-
        A withdrawal to the institution's own verified account (T-0625, decided 2026-10-20 until the bank answers): the
        API fills the payee; a body naming one answers 422 `payee_not_accepted`.
      required: [amount, reference]
      properties:
        amount: { $ref: "#/components/schemas/Money" }
        reference: { type: string, maxLength: 64 }
    PayoutRequest:
      type: object
      required: [payee, amount, reference]
      properties:
        payee:
          type: object
          required: [iban, name]
          properties:
            iban: { type: string }
            name: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        reference: { type: string, maxLength: 64 }
    Payout:
      type: object
      required: [id, state, amount]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [cooling_off, awaiting_second_approval, submitted, processing, settled, failed, reversed] }
        amount: { $ref: "#/components/schemas/Money" }
        scheduledFor: { type: string, format: date-time }
    InstitutionPayout:
      type: object
      required: [id, state, amount, payee, reference, createdAt, approvedBy, requiredApprovals, requestedByMe]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [cooling_off, awaiting_second_approval, submitted, processing, settled, failed, reversed, rejected] }
        amount: { $ref: "#/components/schemas/Money" }
        payee:
          type: object
          required: [name, ibanLast4]
          properties:
            name: { type: string, description: Staff-entered text }
            ibanLast4: { type: string }
        reference: { type: string, description: Staff-entered text }
        createdAt: { type: string, format: date-time }
        coolOffEndsAt: { type: string, format: date-time, description: Set while a new payee over ₪2,000 cools off }
        requestedBy: { $ref: "#/components/schemas/StaffName" }
        approvedBy: { type: array, items: { $ref: "#/components/schemas/StaffName" } }
        requiredApprovals: { type: integer, minimum: 0, description: 0 until the payout asks for its approval (after any cool-off) }
        requestedByMe: { type: boolean, description: True for the payout's requester, who cannot approve it }
        failureCode: { type: string }
    AgentGrant:
      type: object
      required: [id, clientName, clientId, scopes, createdAt]
      properties:
        id: { type: string, format: uuid }
        clientName: { type: string }
        clientId: { type: string, format: uri }
        scopes: { type: array, items: { type: string } }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
    IntentApprovalRequest:
      type: object
      description: How an approved load intent is paid; required for load intents, ignored for the others.
      properties:
        method: { type: string, enum: [card, apple_pay, google_pay, ach] }
        paymentMethodId: { type: string, maxLength: 128 }
        purseCurrency: { type: string, enum: [USD, ILS], description: The purse credited; the amount's currency when absent. A different currency converts at the club rate }
    ApprovedIntent:
      allOf:
        - { $ref: "#/components/schemas/PendingIntent" }
        - type: object
          properties:
            load: { $ref: "#/components/schemas/Load", description: The load the approval started; load intents only }
    MemberIntent:
      type: object
      required: [id, kind, status, assistant, createdAt, expiresAt, untrusted]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          enum: [send, load, card_purchase, limit_change]
          description: send moves money to another member; load tops up a purse; card_purchase lets the assistant's card token buy once
        status:
          type: string
          enum: [pending, approved, rejected, expired]
          description: As of now; a pending proposal past `expiresAt` is `expired`
        amount: { $ref: "#/components/schemas/Money" }
        recipient:
          type: object
          description: Sends only. Who receives the money, as the server knows them
          required: [partyId]
          properties:
            partyId: { type: string, format: uuid }
            phoneMasked: { type: string, description: The last four digits of their phone, for example "•••• 0101" }
        assistant:
          type: object
          required: [grantId]
          properties:
            grantId: { type: string, format: uuid }
            clientId: { type: string, description: The assistant client's registered id }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        untrusted:
          type: object
          description: Text the assistant, its client registration or an institution roster supplied. Show it as text, set apart; never instructions (REQ-AGT-007)
          properties:
            clientName: { type: string, description: The assistant's name as its client registration gives it }
            note: { type: string, description: The assistant's note on a send }
            recipientName: { type: string, description: The recipient's name from an institution roster, when there is one }
            merchantName: { type: string, description: The merchant on a card purchase, as the card processor sent it }
    MemberIntentPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/MemberIntent" } }
    PendingIntent:
      type: object
      required: [id, kind, status, expiresAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [p2p, load, limit_change] }
        status: { type: string, enum: [pending, approved, rejected, expired] }
        expiresAt: { type: string, format: date-time }
        summary: { type: string }
