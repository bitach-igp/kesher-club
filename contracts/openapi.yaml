              - type: object
                required: [memberName]
                properties:
                  memberName: { type: string, description: Roster name; untrusted display text }
        total: { type: array, items: { $ref: "#/components/schemas/Money" } }
        owed:
          type: array
          description: Fee items still due, whatever month they fall due in, the oldest first (T-0611). No spend detail, consented or not (REQ-INS-005).
          items:
            type: object
            required: [feeItemId, memberName, description, amount, dueAt]
            properties:
              feeItemId: { type: string, format: uuid }
              memberName: { type: string, description: Roster name; untrusted display text }
              description: { type: string, description: Staff-entered text }
              amount: { $ref: "#/components/schemas/Money" }
              dueAt: { type: string, format: date }
        owedTotal: { type: array, items: { $ref: "#/components/schemas/Money" } }
    ExportFile:
      type: object
      required: [filename, contentType, base64, rows, totals]
      properties:
        filename: { type: string }
        contentType: { type: string }
        base64: { type: string }
        rows: { type: integer }
        totals:
          type: object
          required: [allowancesOut, feesIn, payoutsOut, depositsIn, net]
          properties:
            allowancesOut: { $ref: "#/components/schemas/Money" }
            feesIn: { $ref: "#/components/schemas/Money" }
            depositsIn: { $ref: "#/components/schemas/Money", description: Recorded bank transfers in and their reversals (T-0614) }
            payoutsOut: { $ref: "#/components/schemas/Money", description: The institution's payouts and their reversals (T-0527) }
            net: { $ref: "#/components/schemas/Money" }
    InstitutionPayoutAccount:
      type: object
