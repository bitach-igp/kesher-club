openapi: 3.1.0
info:
  title: Kesher Club API
  version: 0.1.0
  description: |
    Source of truth for the API (Tab 3 §5). Server validators, the TypeScript SDK (packages/sdk),
    MCP tool schemas and docs are generated from this file. Breaking changes go to a /v2 path.

    Conventions: bearer JWT (10-minute access tokens); money-moving calls need a step-up token
    younger than 5 minutes (REQ-AUTH-006) and an Idempotency-Key (24 h replay window); every error is
    RFC 9457 problem+json with a code from the closed set in packages/domain/src/errors.ts; lists are
    cursor-paginated; Money is `{ minor: string, currency }` so bigint survives JSON.
  contact:
    name: Kesher engineering
servers:
  - url: https://api.kesher.example/v1
tags:
  - name: admin
    description: Admin console operations (ADR-013). Staff token only; never on the MCP surface.
security:
  - bearer: []
paths:
  /auth/otp:
    post:
      operationId: startOtp
      summary: Start phone verification with a 6-digit OTP
      description: REQ-AUTH-001. 5-minute expiry, 5 attempts. Public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpStartRequest" }
      responses:
        "201":
          description: OTP sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpStart" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/otp/verify:
    post:
      operationId: verifyOtp
      summary: Verify the OTP and obtain an otp-session for passkey enrolment or recovery
      description: REQ-AUTH-001 / REQ-AUTH-003. Public.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpVerifyRequest" }
      responses:
        "200":
          description: Verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OtpVerify" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/passkeys/register:
    post:
      operationId: registerPasskey
      summary: Enrol a passkey (two-step; omit `response` to get options)
      description: REQ-AUTH-001. Authenticated by the otp-session token from verifyOtp, or an access token when adding a device. Both steps send the same `deviceId`; the ceremony, the stored passkey and the device row are keyed by it, and refresh later names it.
      security: [{ otpSession: [] }, { bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyRegisterRequest" }
      responses:
        "200":
          description: Registration options, or the stored credential plus tokens once the response is verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyRegisterResult" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/passkeys/authenticate:
    post:
      operationId: authenticatePasskey
      summary: Sign in with a passkey (two-step; omit `response` to get options)
      description: REQ-AUTH-002. Public. Both steps send the same `deviceId`, which keys the challenge and the device's session family. Recovery (OTP) is a separate path and applies a 24 h hold (REQ-AUTH-003).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasskeyAuthenticateRequest" }
      responses:
        "200":
          description: Authentication options, or a token pair once verified
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PasskeyAuthenticateResult" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/token/refresh:
    post:
      operationId: refreshToken
      summary: Rotate the refresh token; reuse of a rotated token revokes the device family
      description: REQ-AUTH-007. Authenticated by the refresh token.
      security: [{ refresh: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              properties:
                deviceId: { $ref: "#/components/schemas/DeviceId" }
      responses:
        "200":
          description: New token pair
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenPair" }
        default: { $ref: "#/components/responses/Problem" }
  /auth/step-up:
    post:
      operationId: stepUp
      summary: Fresh passkey assertion that unlocks money actions for 5 minutes
      description: REQ-AUTH-006. Returns a step-up token to send as `X-Step-Up`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StepUpRequest" }
      responses:
        "200":
          description: Step-up options or token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StepUpResult" }
        default: { $ref: "#/components/responses/Problem" }
  /status:
    get:
      operationId: getStatus
      summary: The public state of each money capability, and the incident while one is switched off
      description: T-0911 (CLUB-39). Public. A capability is off when its flag is off, degraded when an admin switched it off with an incident through the two-person flag flip, and ok when its flag is on and its provider is bound. No secrets and no provider names. The incident is plain text for the in-app banner.
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServiceStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /me/capabilities:
    get:
      operationId: getCapabilities
      summary: Entitlements and live features for the signed-in member
      description: The app renders only what this returns (flags + entitlements).
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Capabilities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capabilities" }
        default: { $ref: "#/components/responses/Problem" }
  /me/institution:
    get:
      operationId: getMyInstitution
      summary: The institution the signed-in member is active staff of, and their role there
      description: >-
        REQ-INS-004 (T-0608). The institution console lands on this. A token without an org role, or a member
        with no active staff row, answers 403 FORBIDDEN: the console shows "no institution access", never data.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: The member's institution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyInstitution" }
        default: { $ref: "#/components/responses/Problem" }
  /me/preferences:
    get:
      operationId: getPreferences
      summary: The member's receiving currency
      description: REQ-PAY-007 (ADR-007). `as_sent`, the default, keeps the sender's currency; USD or ILS converts a send in the other currency at the club rate.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      operationId: updatePreferences
      summary: Set the receiving currency
      description: REQ-PAY-007. Bearer only; a preference moves no money by itself. Unknown values answer VALIDATION_FAILED.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiveCurrency]
              properties:
                receiveCurrency: { type: string, enum: [USD, ILS, as_sent] }
      responses:
        "200":
          description: Preferences after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Preferences" }
        default: { $ref: "#/components/responses/Problem" }
  /households/{id}:
    get:
      operationId: getHousehold
      summary: "A funder's household: members, memberships, funding sources"
      description: Funder role only; members see their own household through /me/capabilities.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Household
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Household" }
        default: { $ref: "#/components/responses/Problem" }
  /memberships:
    post:
      operationId: createMembership
      summary: Start a membership (plan + member) billed to the funder
      description: E03 billing. Idempotent.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MembershipRequest" }
      responses:
        "201":
          description: Membership created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Membership" }
        default: { $ref: "#/components/responses/Problem" }
  /accounts:
    get:
      operationId: listAccounts
      summary: Purses for the member (USD and ILS) with settled, holds and available
      description: REQ-WAL-001. available = settled − holds.
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Account" } }
        default: { $ref: "#/components/responses/Problem" }
  /accounts/{id}/transactions:
    get:
      operationId: listTransactions
      summary: Transactions on a purse, newest first
      description: REQ-WAL-001. Merchant text sits in `untrusted` fields.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/Cursor" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200":
          description: Transactions page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionPage" }
        default: { $ref: "#/components/responses/Problem" }
  /me/closure:
    get:
      operationId: getClosure
      summary: Where closing the account stands
      description: REQ-WAL-005. Pending refunds are checked with the funding vendor on each read.
      responses:
        "200":
          description: Closure status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Closure" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: closeAccount
      summary: Close the account, refunding what remains to where it came from
      description: REQ-WAL-005. Every purse is emptied by refunds against the member's loads before the account closes; holds or an overdrawn purse block it. Requires a step-up token younger than 5 minutes (REQ-AUTH-006). Idempotent.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      responses:
        "200":
          description: Closure status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Closure" }
        default: { $ref: "#/components/responses/Problem" }
  /accounts/{id}/auto-reload:
    get:
      operationId: getAutoReload
      summary: The auto-reload rule on a purse
      description: REQ-WAL-004. 404 when the member has set none.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoReloadRule" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: setAutoReload
      summary: Set or replace the auto-reload rule on a purse
      description: REQ-WAL-004. Below the threshold the worker loads up to the target with the saved payment method, at most once per 24 h. Requires a step-up token younger than 5 minutes (REQ-AUTH-006); it authorises money to move later.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AutoReloadRuleRequest" }
      responses:
        "200":
          description: Rule
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AutoReloadRule" }
        default: { $ref: "#/components/responses/Problem" }
  /loads:
    post:
      operationId: createLoad
      summary: Load a member's purse by card, Apple Pay, Google Pay or ACH
      description: REQ-WAL-002/003. Requires a step-up token younger than 5 minutes (REQ-AUTH-006). Starts the LoadWorkflow keyed by the Idempotency-Key.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoadRequest" }
      responses:
        "201":
          description: Load created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Load" }
        default: { $ref: "#/components/responses/Problem" }
  /transfers:
    post:
      operationId: createTransfer
      summary: Send money to another member (P2P)
      description: REQ-PAY-001..005. Requires a step-up token younger than 5 minutes (REQ-AUTH-006) and an Idempotency-Key (REQ-PAY-005); the TransferWorkflow id is the key.
      security: [{ bearer: [] }]
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "201":
          description: Transfer created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        default: { $ref: "#/components/responses/Problem" }
  /transfers/preview:
    post:
      operationId: previewTransfer
      summary: Preview what a send lands as in the recipient's purse
      description: REQ-PAY-006 (T-0518). Priced exactly as the send prices it, at the current club rate and the recipient's receiving currency; nothing is created or reserved. The same eligibility as a send; limits and the balance are judged by the send. A missing or stale rate answers PROVIDER_UNAVAILABLE.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TransferRequest" }
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransferPreview" }
        default: { $ref: "#/components/responses/Problem" }
  /transfers/{id}/cancel:
    post:
      operationId: cancelTransfer
      summary: Cancel a transfer while it is pending_hold
      description: REQ-PAY-003. Idempotent.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Transfer" }
        default: { $ref: "#/components/responses/Problem" }
  /requests:
    get:
      operationId: listPaymentRequests
      summary: Payment requests the member owes or asked for, open first
      description: REQ-PAY-004. Request text in `note` is untrusted member text.
      responses:
        "200":
          description: Requests
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PaymentRequest" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createPaymentRequest
      summary: Ask another member for money; payable for 14 days
      description: REQ-PAY-004. Idempotent by key.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentRequestCreate" }
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /splits:
    post:
      operationId: createSplit
      summary: Split a bill; every other participant gets a request for their share
      description: REQ-PAY-004. Equal shares; the requester covers any rounding remainder. Idempotent by key.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SplitCreate" }
      responses:
        "201":
          description: Split created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Split" }
        default: { $ref: "#/components/responses/Problem" }
  /requests/{id}/pay:
    post:
      operationId: payPaymentRequest
      summary: Pay a request; the send goes through the ordinary transfer rules
      description: REQ-PAY-004 with REQ-PAY-001..003. Requires a step-up token younger than 5 minutes (REQ-AUTH-006). Paying twice is one transfer.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      responses:
        "200":
          description: The paid request and its transfer
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaidPaymentRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /requests/{id}/decline:
    post:
      operationId: declinePaymentRequest
      summary: Decline a request
      description: REQ-PAY-004. Idempotent.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /requests/{id}/cancel:
    post:
      operationId: cancelPaymentRequest
      summary: Withdraw a request you made
      description: REQ-PAY-004. Idempotent.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: Request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /fx/quotes:
    post:
      operationId: createFxQuote
      summary: Lock a USD/ILS quote for 30 seconds
      description: REQ-FX-001/002. Idempotent.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FxQuoteRequest" }
      responses:
        "201":
          description: Quote
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxQuote" }
        default: { $ref: "#/components/responses/Problem" }
  /fx/conversions:
    post:
      operationId: convert
      summary: Convert at a locked quote
      description: REQ-FX-001. Requires a step-up token younger than 5 minutes (REQ-AUTH-006). QUOTE_EXPIRED after 30 s.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quoteId]
              properties:
                quoteId: { type: string }
      responses:
        "201":
          description: Conversion
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxConversion" }
        default: { $ref: "#/components/responses/Problem" }
  /cards:
    get:
      operationId: listCards
      summary: The member's cards (virtual and physical), newest first
      description: REQ-CRD-001/009. Status, controls and wallet tokens; never card data.
      responses:
        "200":
          description: Cards
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Card" } }
        default: { $ref: "#/components/responses/Problem" }
  /cards/physical:
    post:
      operationId: orderPhysicalCard
      summary: Order a physical card to a US or Israeli address
      description: REQ-CRD-009. Needs T2 identity verification and the card.physical flag. The address goes to the processor and is not stored; tracking comes back on the card. One physical card at a time. Idempotent by key.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shipTo]
              properties:
                shipTo: { $ref: "#/components/schemas/ShipTo" }
      responses:
        "201":
          description: The ordered card, inactive until activation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Problem" }
  /cards/{id}/activate:
    post:
      operationId: activateCard
      summary: Activate a delivered physical card with its last four digits
      description: REQ-CRD-009. Requires a step-up token younger than 5 minutes (REQ-AUTH-006). The PIN is set inside the processor's SDK; the API records only that it was set. Idempotent.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [last4]
              properties:
                last4: { type: string, pattern: "^\\d{4}$" }
      responses:
        "200":
          description: The card, now active
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Problem" }
  /cards/{id}/status:
    post:
      operationId: setCardStatus
      summary: Freeze, unfreeze or close (lost or stolen) a card
      description: REQ-CRD-004/009. Freezing is immediate and needs no step-up; unfreezing and closing require a step-up token younger than 5 minutes (REQ-AUTH-006). A freeze suspends every wallet token; closing deletes them and frees the member to order a replacement. The funder may freeze and unfreeze the member's card. Idempotent.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { name: X-Step-Up, in: header, required: false, description: Required for active and closed., schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [frozen, active, closed] }
                reason: { type: string, enum: [lost, stolen, damaged, other], description: For closed }
      responses:
        "200":
          description: The card after the change
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Problem" }
  /cards/{id}/details-token:
    post:
      operationId: cardDetailsToken
      summary: Short-lived token for the processor's PCI component that shows the card details
      description: REQ-CRD-002. Requires a step-up token younger than 5 minutes (REQ-AUTH-006). The API never sees the PAN; the token is minted by the processor and expires within a minute.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/StepUp" }
      responses:
        "200":
          description: Details token
          content:
            application/json:
              schema:
                type: object
                required: [token, expiresAt]
                properties:
                  token: { type: string }
                  expiresAt: { type: string, format: date-time }
        default: { $ref: "#/components/responses/Problem" }
  /cards/{id}:
    get:
      operationId: getCard
      summary: Card status, controls and wallet tokens (never card data)
      description: REQ-CRD-002/004/005.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Problem" }
  /cards/{id}/controls:
    patch:
      operationId: updateCardControls
      summary: Change card controls; funder-set controls are locked for members
      description: REQ-CRD-004/005. Idempotent.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardControlsPatch" }
      responses:
        "200":
          description: Card
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Card" }
        default: { $ref: "#/components/responses/Problem" }
  /cards/{id}/provisioning/{wallet}:
    post:
      operationId: startPushProvisioning
      summary: In-app push provisioning to Apple Wallet or Google Pay
      description: REQ-CRD-006. Requires a step-up token younger than 5 minutes (REQ-AUTH-006). Idempotent.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: wallet
          in: path
          required: true
          schema: { type: string, enum: [apple, google] }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId, clientData]
              properties:
                deviceId: { type: string }
                clientData: { type: object, additionalProperties: { type: string } }
      responses:
        "200":
          description: Provisioning payload for the OS sheet
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProvisioningPayload" }
        default: { $ref: "#/components/responses/Problem" }
  /catalogue:
    get:
      operationId: listCatalogue
      summary: Add-ons the member can buy (eSIM, insurance, …) with prices from price rules
      description: REQ-MKT-002.
      parameters: [{ $ref: "#/components/parameters/Cursor" }, { $ref: "#/components/parameters/Limit" }]
      responses:
        "200":
          description: Catalogue page
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CataloguePage" }
        default: { $ref: "#/components/responses/Problem" }
  /addon-orders:
    post:
      operationId: createAddonOrder
      summary: Buy an add-on; entitlement credits apply automatically
      description: REQ-MKT-001, REQ-ESIM-001/002, REQ-INSR-001. Idempotent; starts the AddonWorkflow keyed by the Idempotency-Key.
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddonOrderRequest" }
      responses:
        "201":
          description: Order
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AddonOrder" }
        default: { $ref: "#/components/responses/Problem" }
  /institutions/{id}/rosters:
    post:
      operationId: importRoster
      summary: Import a roster CSV with column mapping; all rows or none
      description: REQ-INS-001. Org staff. Idempotent.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RosterImportRequest" }
      responses:
        "200":
          description: Validation report or commit result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RosterImportResult" }
        default: { $ref: "#/components/responses/Problem" }
  /institutions/{id}/collections:
    get:
      operationId: listCollections
      summary: A month's paid fee items for the institution, with receipt numbers, and who still owes
      description: REQ-INS-006. Org staff. Roster names are untrusted display text.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: month, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" } }
      responses:
        "200":
          description: Collections
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Collections" }
        default: { $ref: "#/components/responses/Problem" }
  /institutions/{id}/collections/export:
    get:
      operationId: exportCollections
      summary: The monthly reconciliation export (CSV or XLSX) whose totals equal the ledger
      description: REQ-INS-006. Org staff. The file travels base64-encoded in a JSON envelope so every client receives it the same way.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: month, in: query, required: true, schema: { type: string, pattern: "^\\d{4}-(0[1-9]|1[0-2])$" } }
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, xlsx] } }
        - { name: currency, in: query, required: false, schema: { type: string, enum: [USD, ILS], default: ILS } }
      responses:
        "200":
          description: Export file
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ExportFile" }
        default: { $ref: "#/components/responses/Problem" }
  /fee-items:
    get:
      operationId: listFeeItems
      summary: Fees an institution asks of the member, due first, with receipts for the paid ones
      description: REQ-INS-006.
      responses:
        "200":
          description: Fee items
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/FeeItem" } }
        default: { $ref: "#/components/responses/Problem" }
  /fee-items/{id}/pay:
    post:
      operationId: payFeeItem
      summary: Pay a fee item from the purse; one journal, one receipt
      description: REQ-INS-006. Requires a step-up token younger than 5 minutes (REQ-AUTH-006). Idempotent; paid is final.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      responses:
        "200":
          description: Receipt
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receipt" }
        default: { $ref: "#/components/responses/Problem" }
  /institutions/{id}/allowance-schedules:
    get:
      operationId: listAllowanceSchedules
      summary: The institution's active allowance schedules, with each one's cohort and next date
      description: >-
        REQ-INS-003 (T-0609). Org staff of this institution only; another institution answers 404. The next date is
        today for a schedule that has not run, one week or one month after its last run otherwise (never before
        today), and absent for a one-off that has run.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Schedules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AllowanceSchedule" } }
        default: { $ref: "#/components/responses/Problem" }
  /institutions/{id}/allowance-runs:
    get:
      operationId: listAllowanceRuns
      summary: The institution's allowance runs, newest first, with who requested and approved each
      description: >-
        REQ-INS-003/004 (T-0609). Org staff of this institution only; another institution answers 404. `paidTotal` is
        the sum of the run's settled journals; staff appear by display name only, never by party id or phone.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AllowanceRunSummary" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: runAllowance
      summary: Dry-run or execute an allowance schedule for a date
      description: >-
        REQ-INS-003/004. Org finance; over ₪5,000 needs a second approver, who posts the same run. Idempotent; workflow id
        allowance:{schedule}:{date}. A run that moves money (`dryRun: false`) needs a step-up token younger than 5 minutes
        (REQ-AUTH-006); a preview does not, and lists the members it would pay by roster name. A run, or a preview, that
        the institution's balance and credit limit cannot cover answers INSUFFICIENT_FUNDS with `balance`, `creditLimit`,
        `reserved` and `needed` (REQ-INS-008).
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AllowanceRunRequest" }
      responses:
        "200":
          description: Run preview or status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AllowanceRun" }
        default: { $ref: "#/components/responses/Problem" }
  /institutions/{id}/payout-account:
    get:
      operationId: getInstitutionPayoutAccount
      summary: Where the institution's withdrawals go, the institution's own verified account, masked
      description: >-
        REQ-INS-012 (T-0625). Org finance of this institution. Absent while Kesher compliance has not verified one;
        `changePending` while a change waits for a second compliance approval (payouts wait with it).
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstitutionPayoutAccount" }
        default: { $ref: "#/components/responses/Problem" }
  /institutions/{id}/payouts:
    get:
      operationId: listInstitutionPayouts
      summary: The institution's payouts, newest first, with state, payee, cool-off end and the approvals so far
      description: >-
        REQ-PO-001/002, REQ-INS-004 (T-0527). Org finance of this institution only; another institution answers 404.
        Cursor-paged. `available` is what the institution's own account holds (T-0613). Staff appear by display name only.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { name: cursor, in: query, required: false, schema: { type: string, maxLength: 200 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: Payouts
          content:
            application/json:
              schema:
                type: object
                required: [items, available]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InstitutionPayout" } }
                  nextCursor: { type: string }
                  available: { $ref: "#/components/schemas/Money" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createInstitutionPayout
      summary: Withdraw ILS from the institution's account to its own verified bank account
      description: >-
        REQ-PO-001/002, REQ-INS-004, REQ-INS-012 (T-0527, T-0625). Org finance of this institution. The payee is the
        institution's own verified account (T-0623), filled by the API: a body naming a payee answers 422
        `payee_not_accepted`, and without a verified account 422 `no_verified_account`. Requires a step-up token younger than 5
        minutes (REQ-AUTH-006). Never takes the institution's account below zero (INSUFFICIENT_FUNDS). A new payee over
        ₪2,000 cools off 24 h; over ₪5,000 a second finance member approves (approvePayout). Idempotent.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InstitutionPayoutRequest" }
      responses:
        "201":
          description: The payout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstitutionPayout" }
        default: { $ref: "#/components/responses/Problem" }
  /payouts/{id}/approve:
    post:
      operationId: approvePayout
      summary: Second finance approval of an institution payout; it then goes to the rail
      description: >-
        REQ-INS-004 (T-0527). A finance member of the payout's institution other than its requester (409 for the
        requester). Approving again is a no-op. Requires a step-up token younger than 5 minutes. Idempotent.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      responses:
        "200":
          description: The payout after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstitutionPayout" }
        default: { $ref: "#/components/responses/Problem" }
  /payouts/{id}/reject:
    post:
      operationId: rejectPayout
      summary: Reject an institution payout waiting for its second approver; nothing moves
      description: REQ-INS-004 (T-0527). A finance member of the payout's institution, with a reason. Requires a step-up token younger than 5 minutes. Idempotent.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: The payout, rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstitutionPayout" }
        default: { $ref: "#/components/responses/Problem" }
  /payouts:
    post:
      operationId: createPayout
      summary: Pay out ILS to a validated payee
      description: REQ-PO-001/002. Requires a step-up token younger than 5 minutes (REQ-AUTH-006). New payees over ₪2,000 cool off 24 h. Idempotent.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PayoutRequest" }
      responses:
        "201":
          description: Payout
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payout" }
        default: { $ref: "#/components/responses/Problem" }
  /agent-grants:
    get:
      operationId: listAgentGrants
      summary: "Every agent grant: client, scopes, last used"
      description: REQ-AGT-008.
      responses:
        "200":
          description: Grants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AgentGrant" } }
        default: { $ref: "#/components/responses/Problem" }
  /agent-grants/{id}:
    delete:
      operationId: revokeAgentGrant
      summary: Revoke a grant; effective within 60 s
      description: REQ-AGT-008.
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204":
          description: Revoked
        default: { $ref: "#/components/responses/Problem" }
  /intents:
    get:
      operationId: listIntents
      summary: The proposals an assistant made for the signed-in member
      description: >-
        REQ-AGT-006. Member token only: an assistant's own token is not accepted here, and no MCP tool wraps
        this operation. Each item says what would happen in structured fields; anything the assistant or its
        client registration wrote travels in `untrusted` and is shown as text, never followed (REQ-AGT-007).
        A pending proposal past its 24 h lists as `expired` whether or not the sweep has run.
      parameters:
        - name: state
          in: query
          required: false
          description: Only proposals in this state; all of the member's proposals when absent, newest first
          schema: { type: string, enum: [pending, approved, rejected, expired] }
      responses:
        "200":
          description: Proposals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberIntentPage" }
        default: { $ref: "#/components/responses/Problem" }
  /intents/{id}:
    get:
      operationId: getIntent
      summary: One proposal an assistant made for the signed-in member
      description: REQ-AGT-006. Member token only; another member's proposal is 404. Untrusted text as in listIntents.
      parameters:
        - { $ref: "#/components/parameters/Id" }
      responses:
        "200":
          description: Proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberIntent" }
        default: { $ref: "#/components/responses/Problem" }
  /intents/{id}/decline:
    post:
      operationId: declineIntent
      summary: Decline an assistant's pending proposal
      description: >-
        REQ-AGT-006. Member token only; needs no step-up, since nothing moves. Only a pending proposal inside
        its 24 h can be declined: an expired, approved or declined one answers IDEMPOTENCY_CONFLICT.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      responses:
        "200":
          description: The declined proposal
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MemberIntent" }
        default: { $ref: "#/components/responses/Problem" }
  /intents/{id}/approve:
    post:
      operationId: approveIntent
      summary: Approve an agent's pending intent with a passkey step-up
      description: >-
        REQ-AGT-006. Requires a step-up token younger than 5 minutes (REQ-AUTH-006). Idempotent: the money
        runs under the key `intent:{id}`, the same path as POST /transfers or POST /loads, so a refusal leaves
        the intent pending and a second approval replays the first. A load intent names no funding method,
        so its approval carries one (T-1009); a second approval reuses the first approval's choice.
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUp" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IntentApprovalRequest" }
      responses:
        "200":
          description: Intent, with the load it started when it is a load intent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovedIntent" }
        default: { $ref: "#/components/responses/Problem" }
  /hooks/{provider}:
    post:
      operationId: providerWebhook
      summary: Inbound provider webhook; verified, stored, deduped by event id
      description: REQ-LED-003. Authenticated by the provider's signature header; no bearer. Always 200 once stored.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-z0-9-]{1,30}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        "200":
          description: Stored
          content:
            application/json:
              schema:
                type: object
                required: [eventId, duplicate]
                properties:
                  eventId: { type: string }
                  duplicate: { type: boolean }
        default: { $ref: "#/components/responses/Problem" }
  /jit/card-authorizations:
    post:
      operationId: cardAuthorization
      summary: The card processor's just-in-time authorisation request
      description: REQ-CRD-003 (SEQ-01). Authenticated by the processor's signature, verified by the card-issuing port; no bearer. Checks card status, controls, limits, the purse balance, the plan's card entitlement and a velocity rule, then posts one hold journal keyed by the authorisation id. Any failure or a run past the decision budget declines TIMEOUT. The body and the answer are in the processor's own format.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {}
      responses:
        "200":
          description: The decision, in the processor's format
          content:
            application/json:
              schema: {}
        default: { $ref: "#/components/responses/Problem" }
  /kyc/sessions:
    post:
      operationId: startKycSession
      summary: Start an identity verification session (T1 or T2) with the issuer's KYC provider
      description: Enabling for REQ-CRD-001. Returns the provider session and a short-lived client token for the capture SDK; the token is never stored or shown again. A tier already approved cannot be started again. Idempotent by key.
      security: [{ bearer: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tier]
              properties:
                tier: { type: string, enum: [T1, T2] }
      responses:
        "201":
          description: Session started (or the same session, by idempotency key)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycSessionStarted" }
        default: { $ref: "#/components/responses/Problem" }
  /kyc/status:
    get:
      operationId: getKycStatus
      summary: Where the member's identity verification stands
      description: Enabling for REQ-CRD-001. The latest session's status and the highest approved tier. Never carries images, document data or the client token.
      security: [{ bearer: [] }]
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KycStatus" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/fx/rates:
    get:
      operationId: listAdminFxRates
      tags: [admin]
      summary: The club rate in force and its history for a pair
      description: REQ-FX-003, REQ-ADM-003 (ADR-007). The current rate is the active version valid now; a port-sourced rate past its 15-minute window is not current. Staff token only.
      security: [{ staff: [] }]
      parameters:
        - name: pair
          in: query
          required: false
          schema: { type: string, enum: ["USD/ILS"], default: "USD/ILS" }
      responses:
        "200":
          description: Current rate and history, newest first
          content:
            application/json:
              schema:
                type: object
                required: [pair, items]
                properties:
                  pair: { type: string, enum: ["USD/ILS"] }
                  current: { $ref: "#/components/schemas/FxRate" }
                  items: { type: array, items: { $ref: "#/components/schemas/FxRate" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: proposeAdminFxRate
      tags: [admin]
      summary: Propose a manual club rate; the proposer counts as the first finance approver
      description: REQ-ADM-003. A second, distinct finance approver activates it through approveAdminFxRate; activation supersedes the rate in force and is audited. Staff token with the finance role.
      security: [{ staff: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mid, reason]
              properties:
                pair: { type: string, enum: ["USD/ILS"], default: "USD/ILS" }
                mid: { type: string, pattern: "^\\d{1,6}(\\.\\d{1,6})?$", description: ILS per one USD, a decimal with up to six places }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: The proposed rate and its approval request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxRate" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/fx/rates/{id}/approve:
    post:
      operationId: approveAdminFxRate
      tags: [admin]
      summary: Second finance approval of a manual rate; activates it
      description: REQ-ADM-003. Must come from a different finance user than the proposer. Staff token with the finance role.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The rate after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxRate" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/fx/rates/{id}/reject:
    post:
      operationId: rejectAdminFxRate
      tags: [admin]
      summary: Withdraw or refuse a proposed manual rate
      description: REQ-ADM-003. Staff token with the finance role.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: The rejected rate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FxRate" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/flags:
    get:
      operationId: listAdminFlags
      tags: [admin]
      summary: Every feature flag with its registry default, live value and any pending flip
      description: ADR-013, REQ-ADM-002. Staff token only.
      security: [{ staff: [] }]
      responses:
        "200":
          description: Flags
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminFlag" } }
        default: { $ref: "#/components/responses/Problem" }
  /admin/flags/{key}/flips:
    post:
      operationId: proposeFlagFlip
      tags: [admin]
      summary: Propose a flag flip; the proposer counts as the first approver
      description: REQ-ADM-002. A second, distinct admin approves through approveFlagFlip; the flip applies then and is audited. Staff token only.
      security: [{ staff: [] }]
      parameters:
        - name: key
          in: path
          required: true
          schema: { type: string, pattern: "^[a-z][a-zA-Z0-9.]{2,60}$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, reason]
              properties:
                to: { type: boolean }
                reason: { type: string, minLength: 1, maxLength: 500 }
                incident:
                  type: object
                  description: Member-facing copy GET /status shows while the flag stays off (T-0911). Only with to=false. Plain text.
                  required: [title, body]
                  properties:
                    title: { type: string, minLength: 1, maxLength: 80 }
                    body: { type: string, minLength: 1, maxLength: 280 }
      responses:
        "201":
          description: Approval request
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/flag-flips/{id}/approve:
    post:
      operationId: approveFlagFlip
      tags: [admin]
      summary: Second approval of a flag flip
      description: REQ-ADM-002. Must come from a different admin than the proposer. Staff token only.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Approval request after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApprovalRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/institutions:
    get:
      operationId: listAdminInstitutions
      tags: [admin]
      summary: Institutions, with how many active staff each has
      description: REQ-ADM-004. Staff token only.
      security: [{ staff: [] }]
      responses:
        "200":
          description: Institutions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminInstitution" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: createAdminInstitution
      tags: [admin]
      summary: Onboard an institution
      description: REQ-ADM-004. Admin staff only; audited. Idempotent by key.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/IdempotencyKey" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, market, reason]
              properties:
                name: { type: string, minLength: 1, maxLength: 120 }
                market: { type: string, enum: [US, IL] }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: The institution
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminInstitution" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/institutions/{id}/deposits:
    get:
      operationId: listAdminInstitutionDeposits
      summary: An institution's recorded deposits, its payment reference and what its account holds
      description: REQ-INS-007 (T-0614). Staff token only. Behind `institutions.deposits`.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Deposits
          content:
            application/json:
              schema:
                type: object
                required: [paymentReference, balances, items]
                properties:
                  paymentReference: { type: string, description: What the institution quotes on its transfers, e.g. KC-7M4QX2HD }
                  balances: { type: array, items: { $ref: "#/components/schemas/Money" } }
                  items: { type: array, items: { $ref: "#/components/schemas/InstitutionDeposit" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: recordAdminInstitutionDeposit
      summary: Record a bank transfer in against the institution; a second finance member approves it before it posts
      description: >-
        REQ-INS-007 (T-0614). Kesher finance (staff role `finance`). The recorder's own approval is the first of two.
        Masav carries ILS, ACH USD, a wire either. A rail and bank reference already recorded (and not rejected) answers 409.
        The value date cannot be in the future. Idempotent. Behind `institutions.deposits`.
      security: [{ staff: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, rail, bankReference, valueDate]
              properties:
                amount: { $ref: "#/components/schemas/Money" }
                rail: { type: string, enum: [masav, wire, ach] }
                bankReference: { type: string, minLength: 1, maxLength: 64, description: The statement line's reference; compared without spaces, upper case }
                valueDate: { type: string, format: date }
                note: { type: string, maxLength: 500 }
      responses:
        "201":
          description: The deposit, waiting for its second approver
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstitutionDeposit" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/deposits/{id}/approve:
    post:
      operationId: approveAdminDeposit
      summary: Second finance approval of a deposit; it then posts to the institution's account
      description: REQ-INS-007 (T-0614). A finance member other than the recorder (409 for the recorder). Behind `institutions.deposits`.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The deposit after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstitutionDeposit" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/deposits/{id}/reject:
    post:
      operationId: rejectAdminDeposit
      summary: Reject a recorded deposit before it posts; its bank reference can then be recorded again
      description: REQ-INS-007 (T-0614). Kesher finance, with a reason. Behind `institutions.deposits`.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: The deposit, rejected
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstitutionDeposit" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/institutions/{id}/staff:
    get:
      operationId: listAdminInstitutionStaff
      tags: [admin]
      summary: An institution's staff, and the role grants waiting for a second admin
      description: REQ-ADM-004. Staff token only.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Staff and pending grants
          content:
            application/json:
              schema:
                type: object
                required: [items, pendingGrants]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/InstitutionStaffMember" } }
                  pendingGrants: { type: array, items: { $ref: "#/components/schemas/ApprovalRequest" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: assignAdminInstitutionStaff
      tags: [admin]
      summary: Make a signed-up member one of the institution's staff
      description: >-
        REQ-ADM-004. Admin staff only; audited. The staff role applies at once. The finance and admin roles
        open a staff_grant approval with the proposer as the first approver, and apply when a different
        admin approves it through approveAdminStaffGrant. A role reaches the member's token at their next
        sign-in. A member can be staff of one institution at a time.
      security: [{ staff: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyId, role, reason]
              properties:
                partyId: { type: string, format: uuid }
                role: { type: string, enum: [staff, finance, admin] }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: The staff member when the role applied, or the grant waiting for a second admin
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffAssignment" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/institutions/{id}/staff/{partyId}/remove:
    post:
      operationId: removeAdminInstitutionStaff
      tags: [admin]
      summary: Remove a member from an institution's staff
      description: REQ-ADM-004. Admin staff only; audited. Their institution actions stop at once; the role leaves their token at the next sign-in.
      security: [{ staff: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: partyId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: The staff member, now inactive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InstitutionStaffMember" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/staff-grants/{id}/approve:
    post:
      operationId: approveAdminStaffGrant
      tags: [admin]
      summary: Second approval of an institution finance or admin role
      description: REQ-ADM-004. Must come from a different admin than the proposer; the role applies then and is audited. Staff token only.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The grant after the decision, with the staff member once it applied
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StaffAssignment" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/institutions/{id}/credit-limits:
    get:
      operationId: listAdminCreditLimits
      tags: [admin]
      summary: The institution's credit limit in each currency, and proposals waiting for a second admin
      description: REQ-INS-008 (T-0616). A currency with no approved limit reads 0. Staff token only.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Limits and open proposals
          content:
            application/json:
              schema:
                type: object
                required: [items, pending]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/CreditLimit" } }
                  pending: { type: array, items: { $ref: "#/components/schemas/ApprovalRequest" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: proposeAdminCreditLimit
      tags: [admin]
      summary: Propose a credit limit for one currency
      description: >-
        REQ-INS-008 (T-0616). Admin staff only; audited. Nothing changes until a different admin approves. Allowance runs
        may take the institution's account down to minus the limit; payouts never use it.
      security: [{ staff: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [limit, reason]
              properties:
                limit: { $ref: "#/components/schemas/Money" }
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "201":
          description: The proposal, waiting for a second admin
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request: { $ref: "#/components/schemas/ApprovalRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/credit-limits/{id}/approve:
    post:
      operationId: approveAdminCreditLimit
      tags: [admin]
      summary: Second approval of a credit limit
      description: REQ-INS-008 (T-0616). Must come from a different admin than the proposer; the limit applies then and is audited. Staff token only.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The proposal after the decision, with the limit once it applied
          content:
            application/json:
              schema:
                type: object
                required: [request]
                properties:
                  request: { $ref: "#/components/schemas/ApprovalRequest" }
                  limit: { $ref: "#/components/schemas/CreditLimit" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/institutions/{id}/kyb:
    get:
      operationId: getAdminInstitutionKyb
      tags: [admin]
      summary: An institution's KYB record, its decision, and what an approval would be refused for today
      description: >-
        REQ-INS-011 (T-0620). Staff token. `blocking` lists stable reason codes (for example
        `sanctions_hit_undisposed:<check>`); empty means the record supports an approval. No document or identity
        number is ever held here; evidence is a reference.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The record
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KybRecord" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/institutions/{id}/kyb/people:
    post:
      operationId: addAdminKybPerson
      tags: [admin]
      summary: Add a board member, control person or signatory to an institution's KYB record
      description: REQ-INS-011 (T-0620). Compliance. A retry with the same key answers the same person.
      security: [{ staff: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fullName, roles]
              properties:
                fullName: { type: string, minLength: 1, maxLength: 200, description: Staff-entered text }
                roles: { type: array, minItems: 1, items: { type: string, enum: [board, control, signatory] } }
                partyId: { type: string, format: uuid, description: The member, once they have signed up }
      responses:
        "201":
          description: The person
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KybPerson" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/institutions/{id}/kyb/checks:
    post:
      operationId: recordAdminKybCheck
      tags: [admin]
      summary: Record a check compliance made by hand, or an exception with its reason
      description: >-
        REQ-INS-011 (T-0620). Compliance. The provider is `compliance`. An `excepted` result needs a reason, and an
        excepted sanctions or PEP check still blocks an approval: screening is never excepted.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, result]
              properties:
                kind: { type: string, enum: [registry, identifier, exempt_status, sanctions, pep] }
                personId: { type: string, format: uuid }
                result: { type: string, enum: [clear, hit, missing, excepted] }
                evidenceRef: { type: string, maxLength: 500, description: Where the evidence is kept; never the document itself }
                reason: { type: string, maxLength: 1000 }
      responses:
        "201":
          description: The check
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KybCheck" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/institutions/{id}/kyb/run:
    post:
      operationId: runAdminKybChecks
      tags: [admin]
      summary: Run the automated KYB checks through the provider and record what it says
      description: >-
        REQ-INS-011 (T-0622). Compliance. Registry, identifier match, exempt status, and sanctions and PEP screening
        of the institution and every person in its record; one check per answer, with the provider's reference as
        evidence. Behind `institutions.kyb.checks` (FEATURE_OFF until a vendor is bound); a provider outage
        answers PROVIDER_UNAVAILABLE and records nothing.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identifier, legalName]
              properties:
                identifier: { type: string, maxLength: 20, description: The amuta or company number (IL) or the EIN (US) }
                legalName: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: The record after the checks
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KybRecord" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/kyb/checks/{id}/dispose:
    post:
      operationId: disposeAdminKybCheck
      tags: [admin]
      summary: Dispose of a screening hit as a false positive or a true match
      description: REQ-INS-011 (T-0620). Compliance, with a note; a hit is disposed of once.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, note]
              properties:
                outcome: { type: string, enum: [false_positive, true_match] }
                note: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "200":
          description: The check with its disposition
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KybCheck" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/institutions/{id}/kyb/decisions:
    post:
      operationId: decideAdminKyb
      tags: [admin]
      summary: Decide an institution's KYB
      description: >-
        REQ-INS-010, REQ-INS-011 (T-0620). Compliance. `needs_more_info` and `rejected` apply at once and need reasons.
        An approval names its risk and is refused with VALIDATION_FAILED and a `blocking` list while the record does
        not support it; a high-risk approval answers the approval request a second compliance reviewer approves.
      security: [{ staff: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [needs_more_info, approved_with_limits, approved, rejected] }
                risk: { type: string, enum: [low, medium, high] }
                reasons: { type: array, items: { type: string, maxLength: 500 } }
      responses:
        "201":
          description: The decision, or the approval request waiting for a second reviewer
          content:
            application/json:
              schema:
                type: object
                properties:
                  decision: { $ref: "#/components/schemas/KybDecision" }
                  approval: { $ref: "#/components/schemas/ApprovalRequest" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/kyb/decisions/{id}/approve:
    post:
      operationId: approveAdminKybDecision
      tags: [admin]
      summary: Second compliance approval of a high-risk KYB approval
      description: REQ-INS-011 (T-0620). A different compliance reviewer from the proposer; the record is checked again first.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The approval request, and the decision once it applied
          content:
            application/json:
              schema:
                type: object
                required: [approval]
                properties:
                  approval: { $ref: "#/components/schemas/ApprovalRequest" }
                  decision: { $ref: "#/components/schemas/KybDecision" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/institutions/{id}/payout-accounts:
    get:
      operationId: listAdminPayoutAccounts
      tags: [admin]
      summary: The institution's payout accounts, newest first, with which is active and which waits for approval
      description: REQ-INS-012 (T-0623). Staff token. The IBAN is masked.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/PayoutAccount" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: recordAdminPayoutAccount
      tags: [admin]
      summary: Record the institution's own bank account for payouts
      description: >-
        REQ-INS-012 (T-0623). Compliance. The holder name is as the bank's ownership letter states it and must match the
        registered name the KYB identifier check found; the account takes effect when a different compliance member
        approves it, and a replacement stops payouts until it is approved. Institution payouts go only here.
      security: [{ staff: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [iban, holderName, evidenceRef]
              properties:
                iban: { type: string, maxLength: 40 }
                holderName: { type: string, minLength: 1, maxLength: 70 }
                evidenceRef: { type: string, minLength: 1, maxLength: 500, description: Where the bank's ownership letter is kept }
      responses:
        "201":
          description: The account, pending a second approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutAccount" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/payout-accounts/{id}/approve:
    post:
      operationId: approveAdminPayoutAccount
      tags: [admin]
      summary: Second compliance approval of an institution's payout account
      description: REQ-INS-012 (T-0623). A different compliance member from the one who recorded it.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PayoutAccount" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/bindings:
    get:
      operationId: listAdminBindings
      tags: [admin]
      summary: Every port with the provider and mode bound for this market
      description: ADR-013; the Providers & Flags screen. Staff token only.
      security: [{ staff: [] }]
      responses:
        "200":
          description: Bindings
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/ProviderBinding" } }
        default: { $ref: "#/components/responses/Problem" }
  /admin/audit:
    get:
      operationId: listAdminAudit
      tags: [admin]
      summary: Audit entries for one subject, newest first
      description: REQ-ADM-001. Staff token only.
      security: [{ staff: [] }]
      parameters:
        - name: subject
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: Entries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
        default: { $ref: "#/components/responses/Problem" }
  /admin/audit/verify:
    post:
      operationId: verifyAdminAudit
      tags: [admin]
      summary: Walk the audit hash chain and report the first break
      description: REQ-ADM-001. Staff token only.
      security: [{ staff: [] }]
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditVerification" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/customers:
    get:
      operationId: listAdminCustomers
      tags: [admin]
      summary: Customer search by exact phone, party id, invite email or roster name
      description: T-0907 (A01). Results carry the phone's last four digits only; the operator must know the full number to search by it. Staff token only.
      security: [{ staff: [] }]
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "200":
          description: Matching customers (at most 20)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminCustomerSummary" } }
        default: { $ref: "#/components/responses/Problem" }
  /admin/customers/{id}:
    get:
      operationId: getAdminCustomer
      tags: [admin]
      summary: Customer 360 read model
      description: T-0907 (A01). Identity (masked), memberships, purses, open cases, consents, assistant grants and the audit tail. Cards stay empty until the card programme (E04); no PAN is ever carried. Staff token only.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Customer 360
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminCustomer" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/complaints:
    get:
      operationId: listAdminComplaints
      tags: [admin]
      summary: Every complaint, open ones first by age
      description: REQ-CMP-002. The same rows feed the bank's export; the console computes both SLA clocks from openedAt. Summary is member text. Staff token only.
      security: [{ staff: [] }]
      responses:
        "200":
          description: Complaints
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminComplaint" } }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: openAdminComplaint
      tags: [admin]
      summary: Log a complaint on a member's behalf
      description: REQ-CMP-002. Phone, email, bank and regulator complaints reach staff first; openedAt may be back-dated to when the complaint arrived (never the future) so the SLA clocks are honest. Staff token only.
      security: [{ staff: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [partyId, channel, category, summary]
              properties:
                partyId: { type: string, format: uuid }
                channel: { type: string, enum: [app, email, phone, bank, regulator] }
                category: { type: string, minLength: 1, maxLength: 80 }
                summary: { type: string, minLength: 1, maxLength: 2000, description: Member text; stored and shown as text }
                escalatedToBank: { type: boolean, default: false }
                openedAt: { type: string, format: date-time }
      responses:
        "201":
          description: Complaint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminComplaint" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/complaints/{id}/acknowledge:
    post:
      operationId: acknowledgeAdminComplaint
      tags: [admin]
      summary: Acknowledge an open complaint; stamps the staff subject and the API clock
      description: REQ-CMP-002. Only an open complaint can be acknowledged; the acknowledger becomes its owner. Staff token only.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Complaint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminComplaint" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/complaints/{id}/resolve:
    post:
      operationId: resolveAdminComplaint
      tags: [admin]
      summary: Resolve an open or acknowledged complaint
      description: REQ-CMP-002. Resolving an open complaint acknowledges it in the same stroke. Staff token only.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Complaint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminComplaint" }
        default: { $ref: "#/components/responses/Problem" }
  /admin/alerts:
    get:
      operationId: listAdminAlerts
      tags: [admin]
      summary: Monitoring alerts, undecided first by severity then age
      description: REQ-CMP-001. Alerts are ops cases of the monitoring kinds; summary may quote member or merchant text. Staff token only.
      security: [{ staff: [] }]
      responses:
        "200":
          description: Alerts
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AdminAlert" } }
        default: { $ref: "#/components/responses/Problem" }
  /admin/alerts/{id}/decisions:
    post:
      operationId: decideAdminAlert
      tags: [admin]
      summary: Record a disposition on an alert
      description: REQ-CMP-001. in_review keeps the alert open and can be decided again; cleared and escalated are final. Every decision carries a note and is audited. Staff token only.
      security: [{ staff: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: { type: string, enum: [in_review, cleared, escalated] }
                note: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: Alert after the decision
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminAlert" }
        default: { $ref: "#/components/responses/Problem" }
components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: 10-minute access token }
    refresh: { type: http, scheme: bearer, bearerFormat: opaque, description: Rotating refresh token }
    otpSession: { type: http, scheme: bearer, bearerFormat: opaque, description: Short-lived token from verifyOtp }
    staff: { type: http, scheme: bearer, bearerFormat: JWT, description: 5-minute staff token signed by the admin console (ADR-013) }
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated key; replays return the original response for 24 h.
      schema: { type: string, minLength: 8, maxLength: 128 }
    StepUp:
      name: X-Step-Up
      in: header
      required: true
      description: Step-up token from stepUp, younger than 5 minutes (REQ-AUTH-006).
      schema: { type: string }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    KycSession:
      type: object
      required: [sessionId, tier, status, reasons, startedAt, expiresAt]
      properties:
        sessionId: { type: string }
        tier: { type: string, enum: [T1, T2] }
        status: { type: string, enum: [pending, approved, rejected, review] }
        reasons: { type: array, items: { type: string }, description: Provider reason codes, no PII }
        startedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
    KycSessionStarted:
      allOf:
        - $ref: "#/components/schemas/KycSession"
        - type: object
          required: [clientToken]
          properties:
            clientToken: { type: string, description: For the provider's capture SDK; short-lived, returned once }
    KycStatus:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [none, pending, approved, rejected, review] }
        approvedTier: { type: string, enum: [T1, T2] }
        current: { $ref: "#/components/schemas/KycSession" }
    AdminFlag:
      type: object
      required: [key, value, default, owner, gates, money]
      properties:
        key: { type: string }
        value: { type: boolean }
        default: { type: boolean }
        owner: { type: string }
        gates: { type: string }
        money: { type: boolean }
        changedAt: { type: string, format: date-time }
        pendingFlip: { $ref: "#/components/schemas/ApprovalRequest" }
    ApprovalRequest:
      type: object
      required: [id, kind, subject, status, approvals, requestedBy, expiresAt, payload]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [allowance_run, payout, flag_flip, provider_binding, ledger_correction, fx_rate, staff_grant, institution_deposit, credit_limit, kyb_decision] }
        subject: { type: string }
        status: { type: string, enum: [pending, awaiting_second_approval, approved, rejected, expired] }
        approvals: { type: integer, minimum: 0 }
        requestedBy: { type: string }
        expiresAt: { type: string, format: date-time }
        payload: { type: object, additionalProperties: true }
    PayoutAccount:
      type: object
      required: [id, currency, ibanMasked, holderName, evidenceRef, status, recordedBy, recordedAt]
      properties:
        id: { type: string, format: uuid }
        currency: { type: string, enum: [USD, ILS] }
        ibanMasked: { type: string }
        holderName: { type: string }
        evidenceRef: { type: string }
        status: { type: string, enum: [active, pending, superseded] }
        recordedBy: { type: string }
        recordedAt: { type: string, format: date-time }
        approvedBy: { type: string }
        approvedAt: { type: string, format: date-time }
    KybPerson:
      type: object
      required: [id, fullName, roles]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string, description: Staff-entered text }
        roles: { type: array, items: { type: string, enum: [board, control, signatory] } }
        partyId: { type: string, format: uuid }
    KybCheck:
      type: object
      required: [id, kind, result, provider, detail, checkedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [registry, identifier, exempt_status, sanctions, pep] }
        personId: { type: string, format: uuid, description: Absent for a check on the institution itself }
        result: { type: string, enum: [clear, hit, missing, excepted] }
        provider: { type: string }
        evidenceRef: { type: string }
        detail: { type: object, additionalProperties: true }
        checkedAt: { type: string, format: date-time }
        disposition:
          type: object
          required: [outcome, note, decidedBy, decidedAt]
          properties:
            outcome: { type: string, enum: [false_positive, true_match] }
            note: { type: string }
            decidedBy: { type: string }
            decidedAt: { type: string, format: date-time }
    KybDecision:
      type: object
      required: [status, reasons]
      properties:
        status: { type: string, enum: [needs_more_info, approved_with_limits, approved, rejected] }
        risk: { type: string, enum: [low, medium, high] }
        reasons: { type: array, items: { type: string } }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
    KybRecord:
      type: object
      required: [institutionId, decision, people, checks, blocking]
      properties:
        institutionId: { type: string, format: uuid }
        decision: { $ref: "#/components/schemas/KybDecision" }
        people: { type: array, items: { $ref: "#/components/schemas/KybPerson" } }
        checks: { type: array, items: { $ref: "#/components/schemas/KybCheck" }, description: The latest check of each kind for the institution and each person }
        blocking: { type: array, items: { type: string }, description: What an approval would be refused for today; empty when it is supported }
        pendingApproval: { $ref: "#/components/schemas/ApprovalRequest" }
    CreditLimit:
      type: object
      required: [currency, limit]
      properties:
        currency: { type: string, enum: [USD, ILS] }
        limit: { $ref: "#/components/schemas/Money" }
        setAt: { type: string, format: date-time, description: Absent while no limit was ever approved }
    InstitutionDeposit:
      type: object
      required: [id, institutionId, amount, rail, bankReference, valueDate, status, approvals, recordedByMe, createdAt]
      properties:
        id: { type: string, format: uuid }
        institutionId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        rail: { type: string, enum: [masav, wire, ach] }
        bankReference: { type: string }
        valueDate: { type: string, format: date }
        note: { type: string, description: Staff-entered text }
        status: { type: string, enum: [pending, posted, rejected] }
        approvals: { type: integer, minimum: 0 }
        recordedByMe: { type: boolean, description: True for the recorder, who cannot approve it }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        journalId: { type: string, format: uuid }
    AdminInstitution:
      type: object
      required: [id, name, market, createdAt, activeStaff]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        market: { type: string, enum: [US, IL] }
        createdAt: { type: string, format: date-time }
        activeStaff: { type: integer, minimum: 0 }
    InstitutionStaffMember:
      type: object
      required: [partyId, institutionId, role, active, createdAt]
      properties:
        partyId: { type: string, format: uuid }
        institutionId: { type: string, format: uuid }
        role: { type: string, enum: [staff, finance, admin] }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        phoneMasked: { type: string, description: The last four digits of their phone }
    StaffAssignment:
      type: object
      properties:
        staff: { $ref: "#/components/schemas/InstitutionStaffMember" }
        grant: { $ref: "#/components/schemas/ApprovalRequest" }
    ProviderBinding:
      type: object
      required: [capability, port, direction, vendors, flags, market]
      properties:
        capability: { type: string }
        port: { type: string }
        direction: { type: string, enum: [out, in, out+in] }
        vendors: { type: array, items: { type: string } }
        flags: { type: array, items: { type: string } }
        market: { type: string, enum: [US, IL] }
        provider: { type: string }
        mode: { type: string, enum: [sim, sandbox, live] }
    AdminCustomerSummary:
      type: object
      required: [partyId, displayName, phoneMasked, status, locale, mode, createdAt]
      properties:
        partyId: { type: string, format: uuid }
        displayName: { type: string, description: Roster name when known, otherwise "Member •••• 4567" }
        phoneMasked: { type: string, description: Last four digits only, e.g. "•••• 4567" }
        status: { type: string, enum: [pending, active, restricted, closed] }
        locale: { type: string, enum: [en, he] }
        mode: { type: string, enum: [member, funder, both] }
        createdAt: { type: string, format: date-time }
    AdminCustomer:
      allOf:
        - $ref: "#/components/schemas/AdminCustomerSummary"
        - type: object
          required: [kyc, memberships, purses, cards, openCases, consents, grants, audit]
          properties:
            restrictedUntil: { type: string, format: date-time, description: Recovery hold (REQ-AUTH-009) still in force }
            kyc:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [none, pending, verified, rejected] }
                tier: { type: string, enum: [T1, T2], description: The highest approved tier, present when verified }
                provider: { type: string }
                checkedAt: { type: string, format: date-time }
            memberships:
              type: array
              items:
                type: object
                required: [id, planCode, status, role, counterpartyId]
                properties:
                  id: { type: string, format: uuid }
                  planCode: { type: string }
                  status: { type: string, enum: [incomplete, active, past_due, paused, cancelled] }
                  role: { type: string, enum: [member, funder], description: This party's side of the membership }
                  counterpartyId: { type: string, format: uuid }
                  institutionName: { type: string }
                  currentPeriodEnd: { type: string, format: date-time }
            purses:
              type: array
              items:
                type: object
                required: [id, currency, available, holds]
                properties:
                  id: { type: string, format: uuid }
                  currency: { type: string, enum: [USD, ILS] }
                  available: { $ref: "#/components/schemas/Money" }
                  holds: { $ref: "#/components/schemas/Money" }
            cards:
              type: array
              items:
                type: object
                required: [id, last4, type, status, tokens]
                properties:
                  id: { type: string }
                  last4: { type: string, pattern: "^\\d{4}$" }
                  type: { type: string, enum: [virtual, physical] }
                  status: { type: string, enum: [inactive, active, frozen, closed] }
                  tokens: { type: integer, minimum: 0 }
            openCases:
              type: array
              items:
                type: object
                required: [id, kind, severity, status, openedAt]
                properties:
                  id: { type: string, format: uuid }
                  kind: { type: string }
                  severity: { type: string, enum: [low, medium, high, critical] }
                  status: { type: string, enum: [open, investigating] }
                  openedAt: { type: string, format: date-time }
            consents:
              type: array
              items:
                type: object
                required: [document, version, hash, acceptedAt]
                properties:
                  document: { type: string }
                  version: { type: integer }
                  hash: { type: string }
                  acceptedAt: { type: string, format: date-time }
            grants:
              type: array
              items:
                type: object
                required: [id, clientName, clientId, scopes, createdAt]
                properties:
                  id: { type: string, format: uuid }
                  clientName: { type: string }
                  clientId: { type: string, format: uri }
                  scopes: { type: array, items: { type: string } }
                  createdAt: { type: string, format: date-time }
                  lastUsedAt: { type: string, format: date-time }
                  revokedAt: { type: string, format: date-time }
            audit:
              type: array
              description: Newest first, at most 20
              items:
                type: object
                required: [at, actorId, actorRole, action, reason]
                properties:
                  at: { type: string, format: date-time }
                  actorId: { type: string }
                  actorRole: { type: string }
                  action: { type: string }
                  reason: { type: string }
    AdminComplaint:
      type: object
      required: [id, partyId, channel, category, summary, status, openedAt, loggedBy, escalatedToBank]
      properties:
        id: { type: string, format: uuid }
        partyId: { type: string, format: uuid }
        channel: { type: string, enum: [app, email, phone, bank, regulator] }
        category: { type: string }
        summary: { type: string, description: Member text; render, never interpret }
        status: { type: string, enum: [open, acknowledged, resolved, withdrawn] }
        openedAt: { type: string, format: date-time, description: Both SLA clocks start here }
        loggedBy: { type: string, description: Staff subject, or "member" when filed from the app }
        acknowledgedAt: { type: string, format: date-time }
        acknowledgedBy: { type: string }
        resolvedAt: { type: string, format: date-time }
        resolvedBy: { type: string }
        owner: { type: string }
        escalatedToBank: { type: boolean }
    AdminAlert:
      type: object
      required: [id, kind, severity, status, summary, openedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [structuring, sanctions_hit, kyc_manual_review, velocity, recon_break] }
        severity: { type: string, enum: [low, medium, high, critical] }
        status: { type: string, enum: [open, in_review, cleared, escalated] }
        partyId: { type: string, format: uuid }
        summary: { type: string, description: May quote member or merchant text; render as text }
        openedAt: { type: string, format: date-time }
        decidedBy: { type: string }
        decidedAt: { type: string, format: date-time }
        note: { type: string }
    AuditEntry:
      type: object
      required: [seq, id, at, actorId, actorRole, action, subject, reason, payload, hash, prevHash]
      properties:
        seq: { type: integer }
        id: { type: string, format: uuid }
        at: { type: string, format: date-time }
        actorId: { type: string }
        actorRole: { type: string }
        action: { type: string }
        subject: { type: string }
        reason: { type: string }
        payload: { type: object, additionalProperties: true }
        hash: { type: string }
        prevHash: { type: string }
    AuditVerification:
      type: object
      required: [ok, entries]
      properties:
        ok: { type: boolean }
        entries: { type: integer }
        brokenAtSeq: { type: integer }
        reason: { type: string }
    Money:
      type: object
      required: [minor, currency]
      properties:
        minor: { type: string, pattern: "^-?\\d+$", description: Minor units as a string (bigint-safe) }
        currency: { type: string, enum: [USD, ILS] }
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        code:
          type: string
          enum: [UNAUTHENTICATED, STEP_UP_REQUIRED, RECOVERY_HOLD, FORBIDDEN, NOT_FOUND, VALIDATION_FAILED, INSUFFICIENT_FUNDS, LIMIT_EXCEEDED, QUOTE_EXPIRED, CARD_FROZEN, FEATURE_OFF, PROVIDER_UNAVAILABLE, IDEMPOTENCY_CONFLICT, RATE_LIMITED, AGENT_NOT_ALLOWED]
        detail: { type: string }
        traceId: { type: string }
        balance: { $ref: "#/components/schemas/Money", description: "INSUFFICIENT_FUNDS on an allowance run: what the institution holds" }
        creditLimit: { $ref: "#/components/schemas/Money", description: "INSUFFICIENT_FUNDS on an allowance run: the approved credit limit" }
        reserved: { $ref: "#/components/schemas/Money", description: "INSUFFICIENT_FUNDS on an allowance run: what runs already started still owe" }
        needed: { $ref: "#/components/schemas/Money", description: "INSUFFICIENT_FUNDS on an allowance run: what this run needs" }
    OtpStartRequest:
      type: object
      required: [phone]
      properties:
        phone: { type: string, pattern: "^\\+[1-9]\\d{6,14}$", description: E.164 }
        locale: { type: string, enum: [en, he], default: en }
    OtpStart:
      type: object
      required: [otpId, expiresAt, attemptsAllowed]
      properties:
        otpId: { type: string }
        expiresAt: { type: string, format: date-time }
        attemptsAllowed: { type: integer }
    OtpVerifyRequest:
      type: object
      required: [otpId, code]
      properties:
        otpId: { type: string }
        code: { type: string, pattern: "^\\d{6}$" }
        purpose: { type: string, enum: [register, recovery], default: register }
    OtpVerify:
      type: object
      required: [verified, attemptsLeft]
      properties:
        verified: { type: boolean }
        attemptsLeft: { type: integer }
        otpSessionToken: { type: string, description: Present only when verified }
    DeviceId:
      type: string
      minLength: 1
      maxLength: 128
      description: The app's install id, generated once and kept in the secure store. Not a hardware identifier.
    PasskeyRegisterRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId: { $ref: "#/components/schemas/DeviceId" }
        deviceName: { type: string, maxLength: 64 }
        purpose:
          type: string
          enum: [register, recovery]
          default: register
          description: recovery enrols a passkey on the otp-session of a recovery verification and applies the 24 h hold (REQ-AUTH-003)
        response: { type: object, description: The authenticator's registration response; omit to receive options }
    PasskeyRegisterResult:
      type: object
      properties:
        options: { type: object }
        credentialId: { type: string }
        tokens: { $ref: "#/components/schemas/TokenPair" }
    PasskeyAuthenticateRequest:
      type: object
      required: [deviceId]
      properties:
        deviceId: { $ref: "#/components/schemas/DeviceId" }
        response: { type: object, description: The authenticator's assertion; omit to receive options }
    StepUpRequest:
      type: object
      properties:
        response: { type: object, description: The authenticator's assertion; omit to receive options }
    PasskeyAuthenticateResult:
      type: object
      properties:
        options: { type: object }
        tokens: { $ref: "#/components/schemas/TokenPair" }
    StepUpResult:
      type: object
      properties:
        options: { type: object }
        stepUpToken: { type: string }
        expiresAt: { type: string, format: date-time }
    TokenPair:
      type: object
      required: [accessToken, refreshToken, accessExpiresAt]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        accessExpiresAt: { type: string, format: date-time }
        restrictedUntil: { type: string, format: date-time, description: Set during the 24 h recovery hold (REQ-AUTH-003) }
    MyInstitution:
      type: object
      required: [institution, role, paymentReference]
      properties:
        institution:
          type: object
          required: [id, name, market]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            market: { type: string, enum: [US, IL] }
        role: { type: string, enum: [staff, finance, admin] }
        paymentReference: { type: string, description: What the institution quotes on a transfer into Kesher's account (T-0614) }
    Capabilities:
      type: object
      required: [features, entitlements]
      properties:
        features: { type: object, additionalProperties: { type: boolean } }
        entitlements:
          type: object
          additionalProperties:
            type: object
            required: [remaining]
            properties:
              remaining: { type: string, pattern: "^\\d+$", description: Units left this period (integer as string) }
              unit: { type: string }
              resetsAt: { type: string, format: date-time }
    Household:
      type: object
      required: [id, funderId, members]
      properties:
        id: { type: string, format: uuid }
        funderId: { type: string, format: uuid }
        members:
          type: array
          items:
            type: object
            required: [partyId, displayName, membershipStatus]
            properties:
              partyId: { type: string, format: uuid }
              displayName: { type: string }
              membershipStatus: { type: string, enum: [invited, active, past_due, paused, cancelled] }
    MembershipRequest:
      type: object
      required: [memberPartyId, planCode]
      properties:
        memberPartyId: { type: string, format: uuid }
        planCode: { type: string }
        termMonths: { type: integer, minimum: 1, maximum: 12, default: 10 }
    Membership:
      type: object
      required: [id, planCode, status, price]
      properties:
        id: { type: string, format: uuid }
        planCode: { type: string }
        planVersion: { type: integer }
        status: { type: string, enum: [incomplete, active, past_due, paused, cancelled] }
        price: { $ref: "#/components/schemas/Money" }
        currentPeriodEnd: { type: string, format: date-time }
    Account:
      type: object
      required: [id, currency, settled, holds, available]
      properties:
        id: { type: string, format: uuid }
        currency: { type: string, enum: [USD, ILS] }
        settled: { $ref: "#/components/schemas/Money" }
        holds: { $ref: "#/components/schemas/Money" }
        available: { $ref: "#/components/schemas/Money" }
    Transaction:
      type: object
      required: [id, kind, direction, amount, at, state]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [load, p2p, card, fee, fx, payout, addon, allowance, reversal] }
        direction:
          type: string
          enum: [in, out]
          description: From this purse's point of view. `amount` is always positive; the app signs it from here, never from `kind` (a p2p is out for the sender and in for the recipient).
        amount: { $ref: "#/components/schemas/Money" }
        at: { type: string, format: date-time }
        state: { type: string, enum: [pending, settled, reversed] }
        counterparty: { type: string, description: Untrusted display text (merchant or member) }
        untrusted:
          type: object
          additionalProperties: { type: string }
          description: Free text from merchants or other users; never instructions
    TransactionPage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/Transaction" } }
        nextCursor: { type: string }
    Closure:
      type: object
      required: [state, balances, refunds]
      properties:
        state: { type: string, enum: [open, refunding, blocked, closed] }
        balances:
          type: array
          items:
            type: object
            required: [currency, available, holds]
            properties:
              currency: { type: string, enum: [USD, ILS] }
              available: { $ref: "#/components/schemas/Money" }
              holds: { $ref: "#/components/schemas/Money" }
        refunds:
          type: array
          items:
            type: object
            required: [id, amount, state]
            properties:
              id: { type: string, format: uuid }
              amount: { $ref: "#/components/schemas/Money" }
              state: { type: string, enum: [pending, settled, failed] }
              failureCode: { type: string }
        blockedReason: { type: string, enum: [HOLDS_OUTSTANDING, OVERDRAWN, NO_REFUND_SOURCE, REFUND_FAILED] }
        closedAt: { type: string, format: date-time }
    AutoReloadRuleRequest:
      type: object
      required: [threshold, target, method, paymentMethodId]
      properties:
        enabled: { type: boolean, default: true }
        threshold: { $ref: "#/components/schemas/Money" }
        target: { $ref: "#/components/schemas/Money" }
        method: { type: string, enum: [card, apple_pay, google_pay] }
        paymentMethodId: { type: string, maxLength: 128, description: The saved payment method at the funding vendor; never card data }
    AutoReloadRule:
      type: object
      required: [accountId, currency, enabled, threshold, target, method, paymentMethodId]
      properties:
        accountId: { type: string, format: uuid }
        currency: { type: string, enum: [USD, ILS] }
        enabled: { type: boolean }
        threshold: { $ref: "#/components/schemas/Money" }
        target: { $ref: "#/components/schemas/Money" }
        method: { type: string, enum: [card, apple_pay, google_pay] }
        paymentMethodId: { type: string }
        lastAttemptAt: { type: string, format: date-time }
        nextEligibleAt: { type: string, format: date-time, description: Present while the 24 h window since the last attempt is open }
    LoadRequest:
      type: object
      required: [memberPartyId, amount, method]
      properties:
        memberPartyId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        method: { type: string, enum: [card, apple_pay, google_pay, ach] }
        paymentMethodId: { type: string }
        purseCurrency: { type: string, enum: [USD, ILS], description: The purse credited; the amount's currency when absent. A different currency converts at the club rate }
    Load:
      type: object
      required: [id, state, amount]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [created, requires_action, processing, on_hold, settled, failed] }
        amount: { $ref: "#/components/schemas/Money" }
        holdUntil: { type: string, format: date }
        clientSecret: { type: string }
        credited: { $ref: "#/components/schemas/Money", description: What the purse receives when the load converts into the other currency, after the purse owner's plan markup }
        rateVersion: { type: integer, description: The club rate version the load converted at }
    TransferPreview:
      type: object
      required: [amount, received]
      properties:
        amount: { $ref: "#/components/schemas/Money", description: What leaves the sender's purse }
        received: { $ref: "#/components/schemas/Money", description: What lands in the recipient's purse, after their plan fee when it converts }
        rate: { type: string, description: The club rate the send converts at, before the recipient's plan fee; decimal string for display only. Absent when nothing converts }
        rateVersion: { type: integer, minimum: 1, description: The club rate version it was priced from }
    TransferRequest:
      type: object
      required: [toPartyId, amount]
      properties:
        toPartyId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money", description: The amount and the purse it is paid from; the recipient's receiving currency (/me/preferences) names the purse it lands in }
        note: { type: string, maxLength: 140 }
    Transfer:
      type: object
      required: [id, state, amount]
      properties:
        id: { type: string, format: uuid }
        state: { type: string, enum: [created, submitted, pending, pending_hold, settled, failed, reversed, cancelled] }
        amount: { $ref: "#/components/schemas/Money" }
        holdReleasesAt: { type: string, format: date-time }
        received: { $ref: "#/components/schemas/Money", description: "The recipient's leg when their receiving currency differs from the sent one: converted at the club rate at send time, less their plan markup (REQ-PAY-006). Absent for a same-currency send." }
        rateVersion: { type: integer, description: The club rate version the send was priced from; present with `received` }
    PaymentRequestCreate:
      type: object
      required: [payerPartyId, amount]
      properties:
        payerPartyId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        note: { type: string, maxLength: 140, description: Member text; rendered, never interpreted }
    SplitCreate:
      type: object
      required: [total, participants]
      properties:
        total: { $ref: "#/components/schemas/Money" }
        participants: { type: array, minItems: 1, maxItems: 20, items: { type: string, format: uuid }, description: The other members; the requester may be listed and is skipped }
        note: { type: string, maxLength: 140 }
    PaymentRequest:
      type: object
      required: [id, requesterPartyId, payerPartyId, amount, status, createdAt, expiresAt]
      properties:
        id: { type: string, format: uuid }
        requesterPartyId: { type: string, format: uuid }
        payerPartyId: { type: string, format: uuid }
        amount: { $ref: "#/components/schemas/Money" }
        note: { type: string, description: Untrusted member text }
        splitId: { type: string, format: uuid }
        status: { type: string, enum: [open, paid, declined, expired, cancelled] }
        transferId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
    PaidPaymentRequest:
      allOf:
        - { $ref: "#/components/schemas/PaymentRequest" }
        - type: object
          required: [transfer]
          properties:
            transfer: { $ref: "#/components/schemas/Transfer" }
    Split:
      type: object
      required: [id, total, share, requests]
      properties:
        id: { type: string, format: uuid }
        total: { $ref: "#/components/schemas/Money" }
        share: { $ref: "#/components/schemas/Money" }
        requests: { type: array, items: { $ref: "#/components/schemas/PaymentRequest" } }
    FxQuoteRequest:
      type: object
      required: [from, to]
      properties:
        from: { $ref: "#/components/schemas/Money" }
        to: { type: string, enum: [USD, ILS] }
    FxQuote:
      type: object
      required: [quoteId, from, total, markup, markupBps, rate, expiresAt]
      properties:
        quoteId: { type: string }
        from: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        markup: { $ref: "#/components/schemas/Money" }
        markupBps: { type: integer }
        rate: { type: string, description: Decimal string for display only }
        rateVersion: { type: integer, minimum: 1, description: The club rate version the quote was priced from (REQ-FX-003) }
        expiresAt: { type: string, format: date-time }
    FxConversion:
      type: object
      required: [conversionId, quoteId, from, total, status]
      properties:
        conversionId: { type: string }
        quoteId: { type: string }
        from: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [settled, failed] }
    CapabilityState:
      type: string
      enum: [ok, degraded, "off"]
    ServiceStatus:
      type: object
      required: [capabilities]
      properties:
        capabilities:
          type: object
          required: [wallet, card, p2p, fx, payouts]
          properties:
            wallet: { $ref: "#/components/schemas/CapabilityState" }
            card: { $ref: "#/components/schemas/CapabilityState" }
            p2p: { $ref: "#/components/schemas/CapabilityState" }
            fx: { $ref: "#/components/schemas/CapabilityState" }
            payouts: { $ref: "#/components/schemas/CapabilityState" }
        incident:
          type: object
          required: [title, body, since]
          properties:
            title: { type: string }
            body: { type: string, description: Plain text, shown as written; never a link }
            since: { type: string, format: date-time }
    Preferences:
      type: object
      required: [receiveCurrency]
      properties:
        receiveCurrency: { type: string, enum: [USD, ILS, as_sent] }
        updatedAt: { type: string, format: date-time }
    FxRate:
      type: object
      required: [id, pair, version, mid, source, status, proposedBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        pair: { type: string, enum: ["USD/ILS"] }
        version: { type: integer, minimum: 1 }
        mid: { type: string, description: ILS per one USD, six decimal places; a display string, money never flows through it }
        source: { type: string, enum: [port, manual] }
        status: { type: string, enum: [proposed, active, superseded, rejected] }
        validFrom: { type: string, format: date-time }
        validUntil: { type: string, format: date-time, description: Absent on a manual rate, which holds until superseded }
        proposedBy: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
        approval: { $ref: "#/components/schemas/ApprovalRequest" }
    CardControls:
      type: object
      required: [blockedMccs, atm, online, agentPurchases]
      properties:
        dailyLimit: { $ref: "#/components/schemas/Money" }
        monthlyLimit: { $ref: "#/components/schemas/Money" }
        blockedMccs: { type: array, items: { type: string, pattern: "^\\d{4}$" } }
        allowedCountries: { type: array, items: { type: string, pattern: "^[A-Z]{2}$" } }
        atm: { type: boolean }
        online: { type: boolean }
        agentPurchases:
          type: object
          required: [mode]
          properties:
            mode: { type: string, enum: [off, with_approval, under_amount] }
            underAmount: { $ref: "#/components/schemas/Money" }
    CardControlsPatch:
      type: object
      properties:
        dailyLimit: { $ref: "#/components/schemas/Money" }
        monthlyLimit: { $ref: "#/components/schemas/Money" }
        blockedMccs: { type: array, items: { type: string, pattern: "^\\d{4}$" } }
        allowedCountries: { type: array, items: { type: string, pattern: "^[A-Z]{2}$" } }
        atm: { type: boolean }
        online: { type: boolean }
        agentPurchases:
          type: object
          description: Funder only (REQ-CRD-008)
          required: [mode]
          properties:
            mode: { type: string, enum: [off, with_approval, under_amount] }
            underAmount: { $ref: "#/components/schemas/Money" }
        release: { type: array, items: { type: string }, description: Funder only; control keys to unlock for the member (REQ-CRD-005) }
    ShipTo:
      type: object
      required: [name, line1, city, postalCode, country]
      properties:
        name: { type: string, maxLength: 120 }
        line1: { type: string, maxLength: 120 }
        line2: { type: string, maxLength: 120 }
        city: { type: string, maxLength: 80 }
        region: { type: string, maxLength: 60, description: Required for US }
        postalCode: { type: string, maxLength: 16 }
        country: { type: string, enum: [US, IL] }
    Card:
      type: object
      required: [id, type, status, last4, controls, lockedByFunder, tokens]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [virtual, physical] }
        status: { type: string, enum: [inactive, active, frozen, closed] }
        last4: { type: string }
        controls: { $ref: "#/components/schemas/CardControls" }
        lockedByFunder: { type: array, items: { type: string }, description: Control keys the funder set; disabled for the member with a reason (REQ-CRD-005) }
        tokens:
          type: array
          items:
            type: object
            required: [wallet, status, deviceId]
            properties:
              wallet: { type: string, enum: [apple, google] }
              status: { type: string, enum: [active, suspended, deleted] }
              deviceId: { type: string }
        shipping:
          type: object
          description: Physical cards only; read from the processor, never stored here
          required: [pinSet]
          properties:
            trackingUrl: { type: string, format: uri }
            activatedAt: { type: string, format: date-time }
            pinSet: { type: boolean, description: The PIN was set at the processor during activation; the PIN itself never reaches the API }
    ProvisioningPayload:
      type: object
      required: [encryptedPassData, activationData, ephemeralPublicKey]
      properties:
        encryptedPassData: { type: string }
        activationData: { type: string }
        ephemeralPublicKey: { type: string }
    CatalogueItem:
      type: object
      required: [sku, kind, title, price]
      properties:
        sku: { type: string }
        kind: { type: string, enum: [esim, insurance, concierge] }
        title: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        creditApplies: { type: boolean, description: True when a monthly entitlement credit would cover it (REQ-ESIM-002) }
        disclosures:
          type: object
          properties:
            licensedEntity: { type: string }
            policyWordingUrl: { type: string, format: uri }
            commissionDisclosure: { type: string }
    CataloguePage:
      type: object
      required: [items]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/CatalogueItem" } }
        nextCursor: { type: string }
    AddonOrderRequest:
      type: object
      required: [sku]
      properties:
        sku: { type: string }
        quantity: { type: integer, minimum: 1, default: 1 }
        disclosuresAcknowledged: { type: boolean, description: Required for insurance (REQ-INSR-001) }
    AddonOrder:
      type: object
      required: [id, sku, state, price, creditApplied]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        state: { type: string, enum: [created, charged, fulfilling, fulfilled, failed, refunded] }
        price: { $ref: "#/components/schemas/Money" }
        creditApplied: { $ref: "#/components/schemas/Money" }
        fulfilment:
          type: object
          properties:
            installUrl: { type: string, format: uri }
            iccid: { type: string }
            policyId: { type: string }
    RosterImportRequest:
      type: object
      required: [csv, mapping, commit]
      properties:
        csv: { type: string, description: UTF-8 CSV content (max 2 MB) }
        mapping:
          type: object
          required: [memberName, funderEmail]
          properties:
            memberName: { type: string, description: Column header }
            memberPhone: { type: string }
            funderEmail: { type: string }
            funderPhone: { type: string }
            programme: { type: string }
        commit: { type: boolean, description: false = validate only }
    RosterImportResult:
      type: object
      required: [importId, status, rowCount, errors]
      properties:
        importId: { type: string, format: uuid }
        status: { type: string, enum: [validated, rejected, committed] }
        rowCount: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [row, column, message]
            properties:
              row: { type: integer }
              column: { type: string }
              message: { type: string }
    AllowanceRunRequest:
      type: object
      required: [scheduleId, date, dryRun]
      properties:
        scheduleId: { type: string, format: uuid }
        date: { type: string, format: date }
        dryRun: { type: boolean }
    AllowanceRun:
      type: object
      required: [workflowId, status, memberCount, total]
      properties:
        workflowId: { type: string, description: "Temporal id allowance:{schedule}:{date}" }
        status: { type: string, enum: [preview, awaiting_second_approval, running, completed, failed] }
        memberCount: { type: integer }
        total: { $ref: "#/components/schemas/Money" }
        failures: { type: integer }
        rows:
          type: array
          description: On a preview only, one row per member the run would pay. The name is roster text, untrusted.
          items:
            type: object
            required: [memberName, amount]
            properties:
              memberName: { type: string }
              amount: { $ref: "#/components/schemas/Money" }
    AllowanceSchedule:
      type: object
      required: [id, name, amount, cadence, cohort]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: Staff-entered text }
        amount: { $ref: "#/components/schemas/Money" }
        cadence: { type: string, enum: [weekly, monthly, once] }
        cohort:
          type: object
          required: [kind, memberCount]
          properties:
            kind: { type: string, enum: [all, listed], description: "all: every active member of the institution; listed: the members the schedule names" }
            memberCount: { type: integer, minimum: 0, description: Active members a run would pay today }
        nextDate: { type: string, format: date }
    StaffName:
      type: object
      required: [displayName]
      properties:
        displayName: { type: string, description: "Role and the last four digits of the phone, e.g. Finance •••• 0109" }
    AllowanceRunSummary:
      type: object
      required: [workflowId, scheduleId, scheduleName, runDate, status, memberCount, total, paidTotal, paid, failed, approvedBy, requestedByMe]
      properties:
        workflowId: { type: string }
        scheduleId: { type: string, format: uuid }
        scheduleName: { type: string }
        runDate: { type: string, format: date }
        status: { type: string, enum: [preview, awaiting_second_approval, running, completed, failed] }
        memberCount: { type: integer }
        total: { $ref: "#/components/schemas/Money" }
        paidTotal: { $ref: "#/components/schemas/Money" }
        paid: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }
        requestedBy: { $ref: "#/components/schemas/StaffName" }
        approvedBy: { type: array, items: { $ref: "#/components/schemas/StaffName" } }
        requestedByMe: { type: boolean, description: True when the signed-in staff member asked for this run; they cannot be its second approver }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
    Receipt:
      type: object
      required: [receiptNumber, feeItemId, institutionId, institutionName, memberPartyId, description, amount, paidAt, journalId]
      properties:
        receiptNumber: { type: string }
        feeItemId: { type: string, format: uuid }
        institutionId: { type: string, format: uuid }
        institutionName: { type: string }
        memberPartyId: { type: string, format: uuid }
        description: { type: string, description: Untrusted text from the institution }
        amount: { $ref: "#/components/schemas/Money" }
        paidAt: { type: string, format: date-time }
        journalId: { type: string, format: uuid }
    FeeItem:
      type: object
      required: [id, institutionId, institutionName, description, amount, status, dueAt]
      properties:
        id: { type: string, format: uuid }
        institutionId: { type: string, format: uuid }
        institutionName: { type: string }
        description: { type: string }
        amount: { $ref: "#/components/schemas/Money" }
        status: { type: string, enum: [due, paid, waived] }
        dueAt: { type: string, format: date }
        receipt: { $ref: "#/components/schemas/Receipt" }
    Collections:
      type: object
      required: [month, items, total, owed, owedTotal]
