# CI (T-0002, Tab 3 §9): lint, typecheck, unit + contract tests, trace, Spectral + oasdiff,
# Semgrep, tfsec and pnpm audit. Every job runs on each PR; nothing here needs a secret.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
  security-events: write
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint · typecheck · unit · trace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm trace
      - run: pnpm db:lint

  openapi:
    name: Spectral + oasdiff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint OpenAPI
        run: npx --yes @stoplight/spectral-cli@6.15.0 lint contracts/openapi.yaml --ruleset .spectral.yaml
      - name: Breaking-change check against the base branch (PRs only)
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:contracts/openapi.yaml" > /tmp/base-openapi.yaml
          docker run --rm -v /tmp/base-openapi.yaml:/base.yaml:ro -v "$PWD/contracts/openapi.yaml:/rev.yaml:ro" \
            -v "$PWD/contracts/oasdiff-ignore.txt:/ignore.txt:ro" \
            tufin/oasdiff:latest breaking /base.yaml /rev.yaml --fail-on ERR --err-ignore /ignore.txt

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      # p/typescript + p/nodejs + the weak-crypto and secrets rules from the §8 insecure-default gates.
      - run: semgrep scan --config p/typescript --config p/nodejs --config p/secrets --config p/jwt --error --exclude .claude .

  tfsec:
    name: tfsec (infra/terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Not tfsec-action: it resolves the release through api.github.com, which is rate-limited for
      # unauthenticated runner IPs and refused for authenticated ones (aquasecurity's IP allow list).
      # A pinned release downloaded from github.com and verified against its checksum file needs neither.
      - name: Install tfsec
        env:
          TFSEC_VERSION: v1.28.14
        run: |
          base="https://github.com/aquasecurity/tfsec/releases/download/${TFSEC_VERSION}"
          curl -sSfL -o tfsec-linux-amd64 "${base}/tfsec-linux-amd64"
          curl -sSfL -o tfsec_checksums.txt "${base}/tfsec_checksums.txt"
          expected="$(grep -E ' \*?tfsec-linux-amd64$' tfsec_checksums.txt | awk '{print $1}')"
          test -n "$expected"
          echo "${expected}  tfsec-linux-amd64" | sha256sum -c -
          install -m 0755 tfsec-linux-amd64 /usr/local/bin/tfsec
          rm tfsec-linux-amd64 tfsec_checksums.txt
      - run: tfsec infra/terraform

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high

  terraform:
    name: terraform validate + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra
      - name: Validate every root without a backend
        run: |
          for d in infra/terraform/bootstrap infra/terraform/envs/shared infra/terraform/envs/staging infra/terraform/envs/prod infra/preview; do
            (cd "$d" && terraform init -backend=false -input=false >/dev/null && terraform validate)
          done
      - name: Module tests (plan mode, mocked provider)
        run: cd infra/terraform && terraform init -backend=false -input=false >/dev/null && terraform test
