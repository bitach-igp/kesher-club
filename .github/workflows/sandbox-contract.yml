# Sandbox contract suites (T-0690): nightly, and on demand, runs the adapter suites that can run against a vendor sandbox
# (packages/adapters/src/sandbox.contract.test.ts and crowded/sandbox.test.ts). One job per port, so a job sees only its own vendor's
# secrets. A job runs only when every required secret for its port is set; otherwise it prints a notice and succeeds, so a port with no
# sandbox key yet is a skip, never a red run. A failing job opens an issue titled "Sandbox contract failing: <port>", or comments on the
# open one. Never on pull_request and never from a fork: a schedule and a manual run only, and the jobs refuse a forked repository.
# Names, what each key must be and how to add it: docs/setup/sandbox-contracts.md. tools/release/sandbox-contract-workflow.test.mjs pins this file.
name: sandbox-contract
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sandbox-contract
  cancel-in-progress: false

jobs:
  stripe:
    name: Stripe smoke sandbox
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    env:
      SANDBOX_CONTRACTS: "1"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.STRIPE_SANDBOX_SECRET_KEY }}
      STRIPE_SANDBOX_BILLING_WEBHOOK_SECRET: ${{ secrets.STRIPE_SANDBOX_BILLING_WEBHOOK_SECRET }}
    steps:
      - id: gate
        name: Check the secrets
        run: |
          missing=""
          test -n "$STRIPE_SANDBOX_SECRET_KEY" || missing="$missing STRIPE_SANDBOX_SECRET_KEY"
          test -n "$STRIPE_SANDBOX_BILLING_WEBHOOK_SECRET" || missing="$missing STRIPE_SANDBOX_BILLING_WEBHOOK_SECRET"
          if [ -n "$missing" ]; then
            echo "::notice title=stripe sandbox skipped::no sandbox key yet (missing:$missing)"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v4
      - if: steps.gate.outputs.run == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: steps.gate.outputs.run == 'true'
        run: pnpm install --frozen-lockfile
      - if: steps.gate.outputs.run == 'true'
        name: Run the stripe sandbox suite
        run: pnpm --filter @kesher/adapters exec vitest run src/sandbox.contract.test.ts -t "Stripe sandbox smoke"
      - if: failure()
        name: Open or update the issue
        env:
          PORT: stripe
        run: |
          title="Sandbox contract failing: $PORT"
          body="The nightly sandbox contract run for $PORT failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number,title --jq "map(select(.title == \"$title\"))[0].number // empty")"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

