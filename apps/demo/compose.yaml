# Postgres 16 for the local demo stack (T-0031). Throwaway: development only, no real member, no real
# money. Port 5433 so it never collides with a Postgres already on 5432.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: club
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d club"]
      interval: 2s
      retries: 30
